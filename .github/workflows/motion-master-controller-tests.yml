name: PopeBot Motion Master controller contract

on:
  push:
    branches:
      - "agent/popebot-motionmaster-controller"
    paths:
      - "templates/skills-library/motion-master/**"
      - ".github/workflows/motion-master-controller-tests.yml"
  pull_request:
    paths:
      - "templates/skills-library/motion-master/**"
      - ".github/workflows/motion-master-controller-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controller:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check private controller and tests
        run: |
          node --check templates/skills-library/motion-master/motion-master.mjs
          node --check templates/skills-library/motion-master/motion-master.test.mjs
      - name: Execute isolated HTTP contract tests
        run: node --test templates/skills-library/motion-master/motion-master.test.mjs
      - name: Checkout pinned public Motion Master API for real cross-repo contract
        uses: actions/checkout@v4
        with:
          repository: executiveusa/motionmaster
          ref: 50c0a97482e2c218b89916c491984f8a7923794c
          path: motionmaster-test
          persist-credentials: false
      - name: Build real Motion Master API
        run: |
          npm ci --prefix motionmaster-test/mcp --ignore-scripts --no-audit --no-fund
          npm run build --prefix motionmaster-test/mcp
      - name: Test authenticated PopeBot commands against disposable Motion Master server
        env:
          MOTION_MASTER_TEST_REPO: motionmaster-test
        run: node --test templates/skills-library/motion-master/motion-master.real-api.test.mjs
      - name: Validate skill frontmatter and prevent secret/model dependencies
        run: |
          grep -q '^name: motion-master$' templates/skills-library/motion-master/SKILL.md
          grep -q '^description:' templates/skills-library/motion-master/SKILL.md
          ! grep -R -E 'sk-proj-|ghp_|BEGIN (RSA|OPENSSH) PRIVATE KEY' templates/skills-library/motion-master/
